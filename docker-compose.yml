services:
  postgres:
    image: postgres:16-alpine
    container_name: xdoku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${XDOKU_DB_USER:-xdoku_owner}
      POSTGRES_PASSWORD: ${XDOKU_DB_PASSWORD:-xdoku_local_password}
      POSTGRES_DB: ${XDOKU_DB_NAME:-xdoku}
    ports:
      - "${XDOKU_DB_PORT:-5432}:5432"
    volumes:
      - xdoku_postgres_data:/var/lib/postgresql/data

volumes:
  xdoku_postgres_data:
